name: RINGSIDE Python regression tests
on:
  push:
    branches: [main, "v1.6-*"]
  pull_request:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and testing requirements
        run: python -m pip install -e ".[dev]"
      - name: Run full test suite
        run: python -m pytest -q --tb=short
